# cargo-deny 配置（E-4）：license 白名单 + advisory（RUSTSEC）+ 源限制。
# 用法：cargo install cargo-deny && cargo deny check

[graph]
all-features = true

[advisories]
# 已知安全公告（RUSTSEC）检查。yanked crate 拒绝。
yanked = "deny"
ignore = []

[licenses]
# 允许的开源协议（与 imagent MIT 兼容）。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # webpki-roots（rustls 根证书 bundle，经 reqwest/tungstenite rustls-tls 引入）：
    # 证书数据用 CDLA-Permissive-2.0（Community Data License，标准 permissive）。
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
# 重复依赖告警（不 deny，避免阻断构建——某些传递依赖重复无法避免）。
multiple-versions = "warn"
wildcards = "warn"

[sources]
# 只允许 crates.io + 已知 git 源（防供应链）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
