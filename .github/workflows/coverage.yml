name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked || true
      - name: Generate coverage
        # --ignore-tests：只统计非测试代码；keyring 在 headless Linux 走 fallback 路径（无 keychain）。
        # E-3：去掉 || true——coverage 失败应可见（不再被吞）。tarpaulin 在 headless Linux
        # 走 keyring fallback 路径，应正常产出；非致命的环境差异由上方 fail_ci_if_error 兜底。
        run: cargo tarpaulin --workspace --ignore-tests --out Xml --output-dir coverage/ -- --include-ignored
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
