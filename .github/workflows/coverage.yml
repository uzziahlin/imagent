name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libdbus-1-dev (Linux keyring backend：keyring sync-secret-service 经 libdbus-sys)
        run: |
          sudo systemctl stop unattended-upgrades.service || true
          for i in $(seq 1 30); do
            if sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; then
              echo "apt/dpkg 锁被占（unattended-upgrades 残留），等待... ($i)"; sleep 5
            else break; fi
          done
          sudo apt-get -o Acquire::Retries=5 update && sudo apt-get install -y libdbus-1-dev
      - name: Install protoc (feishu/open-lark websocket 构建依赖)
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.88
      - name: Install tarpaulin
        # 用 prebuilt binary（taiki-e/install-action），避免 `cargo install` 源码编译
        # 失败（原 `cargo install ... --locked || true` 的 `|| true` 吞了安装失败，
        # 致后续 cargo tarpaulin 报 'no such command: tarpaulin'）。
        uses: taiki-e/install-action@cargo-tarpaulin
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        # --ignore-tests：只统计非测试代码；keyring 在 headless Linux 走 fallback 路径（无 keychain）。
        # E-3：去掉 || true——coverage 失败应可见（不再被吞）。tarpaulin 在 headless Linux
        # 走 keyring fallback 路径，应正常产出；非致命的环境差异由上方 fail_ci_if_error 兜底。
        # 不传 --include-ignored：claude 的 real_cli / acp_e2e 是 #[ignore]（需 claude CLI/ACP
        # 真机），CI 无 claude 会 panic——ignored 测试本就不该在 CI coverage 跑。
        run: cargo tarpaulin --workspace --ignore-tests --out Xml --output-dir coverage/
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
