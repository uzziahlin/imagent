name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev (Linux keyring backend：keyring sync-secret-service 经 libdbus-sys)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@1.88
      - name: Install tarpaulin
        # 用 prebuilt binary（taiki-e/install-action），避免 `cargo install` 源码编译
        # 失败（原 `cargo install ... --locked || true` 的 `|| true` 吞了安装失败，
        # 致后续 cargo tarpaulin 报 'no such command: tarpaulin'）。
        uses: taiki-e/install-action@cargo-tarpaulin
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        # --ignore-tests：只统计非测试代码；keyring 在 headless Linux 走 fallback 路径（无 keychain）。
        # E-3：去掉 || true——coverage 失败应可见（不再被吞）。tarpaulin 在 headless Linux
        # 走 keyring fallback 路径，应正常产出；非致命的环境差异由上方 fail_ci_if_error 兜底。
        # 不传 --include-ignored：claude 的 real_cli / acp_e2e 是 #[ignore]（需 claude CLI/ACP
        # 真机），CI 无 claude 会 panic——ignored 测试本就不该在 CI coverage 跑。
        run: cargo tarpaulin --workspace --ignore-tests --out Xml --output-dir coverage/
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
