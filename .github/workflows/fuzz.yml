name: fuzz

# 周期性 fuzz（第二波 S-补充）：fuzz/ 三个 target（ilink_proto_parse /
# ilink_media_cdn_host / feishu_event_parse），覆盖外部输入攻击面（协议解析 +
# CDN host SSRF + 飞书事件 payload）。仅靠本地手跑无法保证 corpus 增长与回归
# 发现，故每周跑一次（各 300s）。手动触发：Actions → fuzz → Run workflow。

on:
  schedule:
    # 每周日 ~04:07 UTC（避开整点，减轻共享 API 压力）
    - cron: '7 4 * * 0'
  workflow_dispatch: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus dev
        # keyring 在 Linux 走 dbus Secret Service（libdbus-sys 构建需要系统头文件），
        # ubuntu runner 只带运行时库不带 -dev；缺它 build.rs 直接 panic。
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        # +nightly 必须显式带：仓库 rust-toolchain.toml pin 1.88，会接管 cargo 的
        # 工具链选择；cargo-fuzz 0.13.2 的 lock 依赖 cargo-platform 0.3.3（要求
        # rustc ≥ 1.91），1.88 下 install 直接失败（2026-08-16 定时任务翻车原因）。
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz ilink_proto_parse (300s)
        run: cargo +nightly fuzz run ilink_proto_parse -- -max_total_time=300
      - name: Fuzz ilink_media_cdn_host (300s)
        run: cargo +nightly fuzz run ilink_media_cdn_host -- -max_total_time=300
      - name: Fuzz feishu_event_parse (300s)
        run: cargo +nightly fuzz run feishu_event_parse -- -max_total_time=300
