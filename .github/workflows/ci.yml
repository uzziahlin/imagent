name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    # E-1：macOS 是一等支持平台（peer_uid LOCAL_PEERCRED / SIGHUP / OS keychain），
    # 必须在 CI 验证——不能只跑 ubuntu 让 macOS 分支长期零覆盖。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev (Linux keyring backend：keyring sync-secret-service 经 libdbus-sys)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      # toolchain 对齐 rust-toolchain.toml pin 的 1.88（用 @stable 会致 cargo fmt 切到
      # 1.88 但 1.88 未装 rustfmt → 'cargo-fmt is not installed for 1.88'）。
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # E-7：--all-features 防未来 feature flag 漏检。
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --verbose

  msrv:
    # 守住声明的 MSRV（rust-version = "1.88"，因 agent-client-protocol-schema 等核心依赖需 rustc 1.88）。
    name: check @ MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev (Linux keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check @ 1.88
        run: cargo check --workspace --all-targets

  audit:
    # 依赖安全审计：PR 也跑（advisory 级别默认 deny），防 dependabot 升级 PR
    # 带新 advisory 直接合入 main 后才暴露。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        # RUSTSEC-2024-0437（protobuf uncontrolled recursion，经 prometheus 0.13.4
        # 传递引入）：imagent 仅用 prometheus 做 /metrics exposition，不解析不可信
        # protobuf，风险低。等 prometheus 上游修复或换 metrics crate 后移除 --ignore
        # （v5-F2，详见 docs/CODE_REVIEW_v5.md）。
        run: cargo audit --ignore RUSTSEC-2024-0437

  deny:
    # cargo-deny（E-4）：license / source / ban 检查（advisory 由上方 audit 覆盖）。
    # v5-F4：PR 也跑（删原 `if: push to main`），与 audit 一致——防 dependabot PR
    # 引入不兼容 license / git 源合入 main 后才暴露。
    name: cargo-deny (licenses/sources/bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check licenses sources bans
