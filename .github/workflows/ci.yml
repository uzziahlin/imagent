name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    # E-1：macOS 是一等支持平台（peer_uid LOCAL_PEERCRED / SIGHUP / OS keychain），
    # 必须在 CI 验证——不能只跑 ubuntu 让 macOS 分支长期零覆盖。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # E-7：--all-features 防未来 feature flag 漏检。
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --verbose

  msrv:
    # 守住声明的 MSRV（rust-version = "1.88"，因 agent-client-protocol-schema 等核心依赖需 rustc 1.88）。
    name: check @ MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check @ 1.88
        run: cargo check --workspace --all-targets

  audit:
    # 依赖安全审计：PR 也跑（advisory 级别默认 deny），防 dependabot 升级 PR
    # 带新 advisory 直接合入 main 后才暴露。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  deny:
    # cargo-deny（E-4）：license / source / ban 检查（advisory 由上方 audit 覆盖）。
    name: cargo-deny (licenses/sources/bans)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check licenses sources bans
