name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# softprops/action-gh-release 创建 Release + generate_release_notes 需要 contents:write
# （缺它 → 403 Resource not accessible by integration）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, artifact: imagent-darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, artifact: imagent-darwin-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: imagent-linux-x86_64 }
          # Windows：keyring windows-native 需单独验证后启用
          # - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: imagent-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus-1-dev (Linux keyring backend：keyring sync-secret-service 经 libdbus-sys)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # 对齐 rust-toolchain.toml pin 的 1.88（用 @stable 会被 rust-toolchain.toml 覆盖回 1.88，
      # 而 @stable 装的 targets 不会落到 1.88 toolchain → E0463 can't find crate for `core`）
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/imagent" "dist/${{ matrix.artifact }}"
          cp LICENSE dist/   # E-6：release artifact 含 LICENSE（合规）
          strip "dist/${{ matrix.artifact }}" || true
          (cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/LICENSE
          generate_release_notes: true
