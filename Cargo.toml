# imagent — Instant messaging, meet your agent.
# Workspace 根配置（crate 结构见 docs/DESIGN.md §2）。

[workspace]
resolver = "2"
exclude = ["fuzz"]  # cargo-fuzz 独立 crate（需 nightly，E-7）
members = ["crates/store", "crates/core", "crates/claude", "crates/codex", "crates/gemini", "crates/ilink", "crates/wecom", "crates/feishu", "crates/relay", "crates/web", "crates/localterm"]

[workspace.package]
version = "1.35.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Uzziah"]
repository = "https://github.com/uzziahlin/imagent"
description = "IM ↔ agent gateway: any IM (iLink / WeCom) ↔ any agent (Claude / Codex / Gemini), in Rust."
publish = false

[workspace.dependencies]
# 异步运行时与并发
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# HTTP / TLS（用 rustls 而非 native-tls：对 iLink 证书更可控，跨平台一致）
# multipart：飞书 im/v1/files 文件上传（P6-7 出站文件）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
url = "2"

# 序列化
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 加密（iLink 媒体 AES-128-ECB + PKCS7，协议强制，见 docs/RESEARCH.md）
aes = "0.9"
ecb = "0.2"
cipher = "0.4"
base64 = "0.23"
hex = "0.4"
# S3 凭据应用层加密（store：keyring 不可用时的加密回退）
aes-gcm = "0.10"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
hmac = { version = "0.13", default-features = false }

# 存储 / 工具
# bundled SQLite 的 CVE 不进 cargo-audit（audit 只看 RUSTSEC，bundled 的 C 代码
# 无 advisory 源）；升级本依赖 = 升级内嵌 SQLite，需定期（每季度）手动检查
# libsqlite3-sys 版本（T16 供应链，见 CODE_REVIEW_v13 P3）。运行时版本见 /doctor。
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
qrcode = "0.14"        # 扫码登录终端二维码
rand = "0.9"
# 本地终端（imagent claude）客户端行编辑/历史（crates/localterm term.rs）。
# 版本上限受 workspace rust-version=1.88 约束：rustyline 18+ 用到 file_lock
# （Rust 1.89 起稳定），17.x 为 1.88 可编译的最新线。
rustyline = "17"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
toml = "1"
# 敏感输入关回显（P3-f，code-review v14；bin 经 workspace 引用）。
rpassword = "7"
# RUSTSEC-2024-0437：默认特性的 protobuf 2.28 有递归崩溃漏洞，我们只用文本
# 格式指标（registry/text encoding），关掉 protobuf 导出器特性即可移除该依赖。
prometheus = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
axum = "0.8"
# Web 驾驶舱（M1）：crates/relay 内嵌 SPA 静态资源（rust-embed）
rust-embed = "8"
# Web 驾驶舱 passkey 登录：relay 作为 WebAuthn RP（crates/relay，注册/断言验签）
webauthn-rs = "0.5"
# ACP（Agent Client Protocol）：claude-agent-acp 长驻子进程模式（agent-client-protocol SDK）
agent-client-protocol = "2"
# 飞书 open-lark SDK（package name=openlark，lib name=open_lark，二者不同名是 SDK 设计）
openlark = { version = "0.20", default-features = false, features = ["auth", "communication", "websocket"] }

# passkey（L3）：webauthn-rs → openssl 传递依赖；vendored = musl 交叉（ECS 部署）时源码编译静态链入，免目标机 libssl。
openssl = { version = "0.10", features = ["vendored"] }
# 网关 ed25519 挑战应答认证（协议 v1.3）：relay 侧验签（只存公钥）+ 网关侧
# 签名（私钥 seed 落 ~/.imagent/web-gateway-key，0600）。纯 Rust 实现，无 C 依赖，
# 不影响 relay 的 openssl vendored 链。
ed25519-dalek = "2"
# E2E 中继盲化（协议 v1.4，crates/web）：浏览器↔网关业务帧 XChaCha20-Poly1305，
# 会话密钥 X25519 + HKDF-SHA256。x25519-dalek 的 StaticSecret（网关静态密钥）
# 需 static_secrets feature；2.x 与 ed25519-dalek 2.x 共用 curve25519-dalek 4。
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.13"
# Web Push 服务端（协议 v1.10，crates/relay）：VAPID ES256 签名 + RFC8291
# aes128gcm 载荷加密。**musl 交叉纪律**：default-features=false 关掉自带
# HTTP 客户端（isahc→libcurl C 依赖 / hyper-tls→native-tls），只取加密与
# 签名构建器，HTTP 投递用本工作区 reqwest（rustls）自转（见 relay push.rs）；
# 内部链 ece→openssl 与 webauthn-rs 同链，统一走上面 vendored（源码静态编
# 译），无新增 C 依赖类别。
web-push = { version = "0.11", default-features = false }

[package]
name = "imagent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
imagent-feishu = { path = "crates/feishu" }
imagent-wecom = { path = "crates/wecom" }
imagent-core = { path = "crates/core" }
imagent-ilink = { path = "crates/ilink" }
imagent-claude = { path = "crates/claude" }
imagent-codex = { path = "crates/codex" }
imagent-gemini = { path = "crates/gemini" }
imagent-store = { path = "crates/store" }
# Web 驾驶舱 M2：网关侧 WebPlatform（出站 WS 客户端连 relay）。
imagent-web = { path = "crates/web" }
# 本地终端平台（imagent claude）：网关侧 LocalPlatform（unix socket）+ term 客户端。
imagent-localterm = { path = "crates/localterm" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# delegate 模块：DelegateApi trait impl（async_trait 派生）
async-trait = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
# join 向导：config.toml 合并写入（toml::Table 反序列化-改-序列化保形）。
toml = { workspace = true }
reqwest = { workspace = true }
# setup 向导 / login wecom 的敏感输入关回显（P3-f，code-review v14）——
# 终端 termios 由 rpassword 处理；非 TTY（管道）由调用方回退 read_line。
rpassword = { workspace = true }
# rustls 0.23 需显式安装 CryptoProvider（process-level）；飞书 open-lark 走 rustls TLS。
# ring 是纯 Rust 实现（无 nasm/cmake），与 reqwest 的 rustls-tls(ring) 一致。
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
async-trait = { workspace = true }
serial_test = "3"
