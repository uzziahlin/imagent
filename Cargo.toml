# imagent — Instant messaging, meet your agent.
# Workspace 根配置（crate 结构见 docs/DESIGN.md §2）。

[workspace]
resolver = "2"
exclude = ["fuzz"]  # cargo-fuzz 独立 crate（需 nightly，E-7）
members = ["crates/store", "crates/core", "crates/claude", "crates/codex", "crates/gemini", "crates/ilink", "crates/wecom"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Uzziah"]
repository = "https://github.com/uzziah/imagent"
description = "IM ↔ agent gateway: any IM (iLink / WeCom) ↔ any agent (Claude / Codex / Gemini), in Rust."
publish = false

[workspace.dependencies]
# 异步运行时与并发
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# HTTP / TLS（用 rustls 而非 native-tls：对 iLink 证书更可控，跨平台一致）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 加密（iLink 媒体 AES-128-ECB + PKCS7，协议强制，见 docs/RESEARCH.md）
aes = "0.8"
ecb = "0.1"
cipher = "0.4"
base64 = "0.22"
hex = "0.4"

# 存储 / 工具
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
qrcode = "0.14"        # 扫码登录终端二维码
rand = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
toml = "0.8"
prometheus = "0.13"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
axum = "0.7"
# ACP（Agent Client Protocol）：claude-agent-acp 长驻子进程模式（agent-client-protocol SDK）
agent-client-protocol = "1"

[package]
name = "imagent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
imagent-wecom = { path = "crates/wecom" }
imagent-core = { path = "crates/core" }
imagent-ilink = { path = "crates/ilink" }
imagent-claude = { path = "crates/claude" }
imagent-codex = { path = "crates/codex" }
imagent-gemini = { path = "crates/gemini" }
imagent-store = { path = "crates/store" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
serial_test = "3"
