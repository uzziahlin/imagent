[package]
name = "imagent-feishu"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
imagent-core = { path = "../core" }
# v1.21 outbox：发送失败的持久化重试队列（drain 提示类 best-effort 消息落盘）。
imagent-store = { path = "../store" }
# v1.21 入站管道可观测性：与 core/ilink 共享默认 registry 自注册指标。
prometheus = { workspace = true }
openlark = { workspace = true }
# Wave B-4：quiet_hours 免打扰时段的本地时区判定（Local::now；已是 lock 内传递
# 依赖，无新增包）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
